
name: Update Mr Ennis Leaderboard

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: update-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Add score to leaderboard
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const match = issue.title.match(/^SCORE:\s*(\d+)\s*\|\s*(.{1,30})$/i);

            if (!match) {
              core.setFailed("Invalid score submission title.");
              return;
            }

            const score = Number(match[1]);
            if (!Number.isSafeInteger(score) || score < 0) {
              core.setFailed("Invalid score.");
              return;
            }

            const username = issue.user.login;
            const path = "leaderboard.json";
            const repo = context.repo;
            const branch = context.payload.repository.default_branch;

            const file = await github.rest.repos.getContent({
              ...repo,
              path,
              ref: branch
            });

            const data = JSON.parse(
              Buffer.from(file.data.content, "base64").toString("utf8")
            );

            data.scores = data.scores || [];

            if (data.scores.some(s => s.issue === issue.number)) {
              return;
            }

            data.scores.push({
              username,
              score,
              issue: issue.number
            });

            data.scores.sort((a, b) => b.score - a.score);
            data.scores = data.scores.slice(0, 10);

            await github.rest.repos.createOrUpdateFileContents({
              ...repo,
              path,
              message: `Update leaderboard from score submission #${issue.number}`,
              content: Buffer.from(
                JSON.stringify(data, null, 2)
              ).toString("base64"),
              sha: file.data.sha,
              branch
            });
